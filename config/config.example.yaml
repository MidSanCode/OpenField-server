# Server configuration
# Copy this file to config.local.yaml for local development
# DO NOT commit config.local.yaml to version control

server:
  port: "8080"
  mode: "debug" # debug, release, test
  # Cross-origin access for browser clients. Empty allowed_origins (or
  # allow_all_origins: true) permits requests from any origin.
  allowed_origins: []
  allow_all_origins: true

# Internal microservice addresses (used by the gateway to route requests)
services:
  account: "http://127.0.0.1:8081"
  storage: "http://127.0.0.1:8082"
  chat: "http://127.0.0.1:8083"
  posts: "http://127.0.0.1:8084"
  push: "http://127.0.0.1:8085"


database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  dbname: "openfield"
  sslmode: "disable"
  max_open_conns: 25
  max_idle_conns: 5
  # Force a full schema migration at startup. Historically only the account
  # service (the schema owner) needed this enabled.
  migrate: true
  # Automatic schema upgrade: when the database is missing a required table or
  # column (fresh database, or a newer version that added parameters), every
  # service upgrades the schema itself on boot. Defaults to true when unset.
  # Set to false to disable.
  auto_migrate: true

redis:
  addr: "localhost:6379"
  password: ""
  db: 0
  enabled: false # Set to true to enable Redis

oidc:
  issuer_url: "https://auth.yun/oidc"
  client_id: ""
  client_secret: ""
  redirect_url: "http://localhost:8080/api/v1/auth/oidc/callback"
  # URL the browser is sent to after authentication with access_token & user
  # info. For the web app point this at the hosted site (the app picks the
  # tokens up from the query string); desktop/mobile builds use a custom scheme
  # deep link instead (e.g. openfield://oauth/callback).
  app_redirect_url: "https://openfield.eu.cc/"
  scopes:
    - "openid"
    - "profile"
    - "email"

jwt:
  secret_key: "your-secret-key-change-this-in-production"
  expiry_hours: 24

storage:
  # S3-compatible object storage (AWS S3, MinIO, RustFS, ...)
  endpoint: "localhost:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  # Legacy single-bucket mode: when `buckets` is empty, the bucket below plus
  # public_base_url define the single default bucket.
  bucket: "openfield"
  # AWS region; only required for AWS S3 / SigV4 region-scoped signing
  region: ""
  use_ssl: false
  # Public base URL used to build file URLs returned by the API. Leave empty to
  # derive it from the endpoint and bucket (works for AWS S3 out of the box).
  public_base_url: "http://localhost:9000/openfield"
  # 10 MB default upload limit
  max_upload_bytes: 10485760
  # Max attachments per post
  max_attachments_per_post: 9
  # Physical multi-bucket mode: each logical bucket is its own S3 bucket with
  # a default quota and an optional membership gate (min_member_level: level
  # required to use it, 0 = everyone). omitting the list keeps single-bucket
  # behavior above.
  # buckets:
  #   - name: "default"           # logical id stored on users.storage_bucket
  #     bucket: "openfield"       # physical S3 bucket
  #     label: "标准"
  #     default_quota: 104857600   # 100 MB
  #     min_member_level: 0
  #     is_default: true
  #   - name: "star"              # Lv.4 (孤星) members only
  #     bucket: "openfield-star"
  #     label: "孤星"
  #     default_quota: 5368709120  # 5 GB
  #     min_member_level: 4
  #     is_default: false
