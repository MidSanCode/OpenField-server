name: Build OpenField Server

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Windows (x64)'
        type: boolean
        default: true
      build_linux:
        description: 'Linux (x64)'
        type: boolean
        default: true
      build_linux_arm:
        description: 'Linux (ARM64)'
        type: boolean
        default: false
      build_darwin:
        description: 'macOS (x64)'
        type: boolean
        default: false

env:
  GO_VERSION: '1.25.0'

jobs:
  # Builds the build matrix from the workflow_dispatch inputs (or the default
  # targets on a tag push). Only the selected targets become matrix entries, so
  # disabled targets do not spin up a runner or attempt a build at all.
  compute-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          set -e
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            W="${{ github.event.inputs.build_windows }}"
            L="${{ github.event.inputs.build_linux }}"
            A="${{ github.event.inputs.build_linux_arm }}"
            D="${{ github.event.inputs.build_darwin }}"
          else
            # Tag push: ship the default targets.
            W=true; L=true; A=false; D=false
          fi
          entries="[]"
          [ "$W" == "true" ] && entries=$(jq -c '. + [{"id":"windows","goos":"windows","goarch":"amd64","ext":".exe"}]' <<< "$entries")
          [ "$L" == "true" ] && entries=$(jq -c '. + [{"id":"linux","goos":"linux","goarch":"amd64","ext":""}]' <<< "$entries")
          [ "$A" == "true" ] && entries=$(jq -c '. + [{"id":"linux-arm","goos":"linux","goarch":"arm64","ext":""}]' <<< "$entries")
          [ "$D" == "true" ] && entries=$(jq -c '. + [{"id":"darwin","goos":"darwin","goarch":"amd64","ext":""}]' <<< "$entries")
          echo "matrix=$entries" >> "$GITHUB_OUTPUT"

  build:
    needs: compute-matrix
    runs-on: ubuntu-latest
    if: ${{ needs.compute-matrix.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.compute-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build services
        shell: bash
        run: |
          set -e
          mkdir -p dist/bin
          CGO_ENABLED=0
          for svc in account storage chat posts push gateway; do
            GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags="-s -w" \
              -o "dist/bin/openfield-$svc${{ matrix.ext }}" "./services/$svc/cmd"
          done

      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.goos }}" == "windows" ]; then
            zip -r openfield-server-${{ matrix.goos }}-${{ matrix.goarch }}.zip bin
          else
            tar -czf openfield-server-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz bin
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: openfield-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/openfield-server-${{ matrix.goos }}-${{ matrix.goarch }}.*
          if-no-files-found: error

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
