name: Build OpenField Server

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Windows (x64)'
        type: boolean
        default: true
      build_linux:
        description: 'Linux (x64)'
        type: boolean
        default: true
      build_linux_arm:
        description: 'Linux (ARM64)'
        type: boolean
        default: false
      build_darwin:
        description: 'macOS (x64)'
        type: boolean
        default: false

env:
  GO_VERSION: '1.25.0'
  # Every service shipped in release archives. Keep in sync with go.work.
  SERVICES: account plugin storage chat posts push gateway
  # All module go.sum files, so setup-go's build cache keys on all of them.
  GO_SUMS: |
    go.sum
    pkg/go.sum
    services/account/go.sum
    services/plugin/go.sum
    services/storage/go.sum
    services/chat/go.sum
    services/posts/go.sum
    services/push/go.sum
    services/gateway/go.sum

jobs:
  # One job per release target, each gated by its workflow_dispatch input, the
  # same shape as the app's build workflow. Only the checked targets are ever
  # built or packaged. On a tag push the default targets (Windows + Linux x64)
  # ship so releases keep producing artifacts without manual dispatch.

  windows:
    if: ${{ github.event_name == 'push' || inputs.build_windows }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ env.GO_SUMS }}

      - name: Build services
        shell: bash
        run: |
          set -e
          mkdir -p dist/bin
          for svc in $SERVICES; do
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" \
              -o "dist/bin/openfield-$svc.exe" "./services/$svc/cmd"
          done

      - name: Package
        shell: bash
        run: |
          cd dist
          zip -r openfield-server-windows-amd64.zip bin

      - uses: actions/upload-artifact@v4
        with:
          name: openfield-server-windows-amd64
          path: dist/openfield-server-windows-amd64.zip
          if-no-files-found: error

  linux:
    if: ${{ github.event_name == 'push' || inputs.build_linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ env.GO_SUMS }}

      - name: Build services
        shell: bash
        run: |
          set -e
          mkdir -p dist/bin
          for svc in $SERVICES; do
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" \
              -o "dist/bin/openfield-$svc" "./services/$svc/cmd"
          done

      - name: Package
        shell: bash
        run: |
          cd dist
          tar -czf openfield-server-linux-amd64.tar.gz bin

      - uses: actions/upload-artifact@v4
        with:
          name: openfield-server-linux-amd64
          path: dist/openfield-server-linux-amd64.tar.gz
          if-no-files-found: error

  linux-arm:
    if: inputs.build_linux_arm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ env.GO_SUMS }}

      - name: Build services
        shell: bash
        run: |
          set -e
          mkdir -p dist/bin
          for svc in $SERVICES; do
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" \
              -o "dist/bin/openfield-$svc" "./services/$svc/cmd"
          done

      - name: Package
        shell: bash
        run: |
          cd dist
          tar -czf openfield-server-linux-arm64.tar.gz bin

      - uses: actions/upload-artifact@v4
        with:
          name: openfield-server-linux-arm64
          path: dist/openfield-server-linux-arm64.tar.gz
          if-no-files-found: error

  darwin:
    if: inputs.build_darwin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ env.GO_SUMS }}

      - name: Build services
        shell: bash
        run: |
          set -e
          mkdir -p dist/bin
          for svc in $SERVICES; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" \
              -o "dist/bin/openfield-$svc" "./services/$svc/cmd"
          done

      - name: Package
        shell: bash
        run: |
          cd dist
          tar -czf openfield-server-darwin-amd64.tar.gz bin

      - uses: actions/upload-artifact@v4
        with:
          name: openfield-server-darwin-amd64
          path: dist/openfield-server-darwin-amd64.tar.gz
          if-no-files-found: error

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ env.GO_SUMS }}

      # This is a multi-module repo (a workspace root plus pkg/ and one module
      # per service). `go vet ./...` at the root matches no packages in
      # workspace mode — it must run once per module. Modules that contain no
      # packages (the workspace root only orchestrates go.work) are skipped.
      - name: Vet
        shell: bash
        run: |
          fail=0
          for mod in . pkg services/*; do
            [ -f "$mod/go.mod" ] || continue
            # `go list ./...` exits 0 even when nothing matched (warning only),
            # so probe by output: an empty list means the module has no
            # packages (the workspace root just orchestrates go.work).
            pkgs=$(cd "$mod" && go list ./... 2>/dev/null)
            if [ -z "$pkgs" ]; then
              echo "skipping $mod (no packages)"
              continue
            fi
            echo "vetting $mod"
            (cd "$mod" && go vet ./...) || fail=1
          done
          exit $fail

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
