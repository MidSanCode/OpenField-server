name: Build OpenField Server

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Windows (x64)'
        type: boolean
        default: true
      build_linux:
        description: 'Linux (x64)'
        type: boolean
        default: true
      build_linux_arm:
        description: 'Linux (ARM64)'
        type: boolean
        default: false
      build_darwin:
        description: 'macOS (x64)'
        type: boolean
        default: false

env:
  GO_VERSION: '1.25.0'

jobs:
  # One job per release target, each gated by its workflow_dispatch input, the
  # same shape as the app's build workflow. Only the checked targets are ever
  # built or packaged. On a tag push the default targets (Windows + Linux x64)
  # ship so releases keep producing artifacts without manual dispatch.

  windows:
    if: ${{ github.event_name == 'push' || inputs.build_windows }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build services
        shell: bash
        run: |
          set -e
          mkdir -p dist/bin
          for svc in account storage chat posts push gateway; do
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" \
              -o "dist/bin/openfield-$svc.exe" "./services/$svc/cmd"
          done

      - name: Package
        shell: bash
        run: |
          cd dist
          zip -r openfield-server-windows-amd64.zip bin

      - uses: actions/upload-artifact@v4
        with:
          name: openfield-server-windows-amd64
          path: dist/openfield-server-windows-amd64.zip
          if-no-files-found: error

  linux:
    if: ${{ github.event_name == 'push' || inputs.build_linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build services
        shell: bash
        run: |
          set -e
          mkdir -p dist/bin
          for svc in account storage chat posts push gateway; do
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" \
              -o "dist/bin/openfield-$svc" "./services/$svc/cmd"
          done

      - name: Package
        shell: bash
        run: |
          cd dist
          tar -czf openfield-server-linux-amd64.tar.gz bin

      - uses: actions/upload-artifact@v4
        with:
          name: openfield-server-linux-amd64
          path: dist/openfield-server-linux-amd64.tar.gz
          if-no-files-found: error

  linux-arm:
    if: inputs.build_linux_arm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build services
        shell: bash
        run: |
          set -e
          mkdir -p dist/bin
          for svc in account storage chat posts push gateway; do
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" \
              -o "dist/bin/openfield-$svc" "./services/$svc/cmd"
          done

      - name: Package
        shell: bash
        run: |
          cd dist
          tar -czf openfield-server-linux-arm64.tar.gz bin

      - uses: actions/upload-artifact@v4
        with:
          name: openfield-server-linux-arm64
          path: dist/openfield-server-linux-arm64.tar.gz
          if-no-files-found: error

  darwin:
    if: inputs.build_darwin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build services
        shell: bash
        run: |
          set -e
          mkdir -p dist/bin
          for svc in account storage chat posts push gateway; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" \
              -o "dist/bin/openfield-$svc" "./services/$svc/cmd"
          done

      - name: Package
        shell: bash
        run: |
          cd dist
          tar -czf openfield-server-darwin-amd64.tar.gz bin

      - uses: actions/upload-artifact@v4
        with:
          name: openfield-server-darwin-amd64
          path: dist/openfield-server-darwin-amd64.tar.gz
          if-no-files-found: error

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
