name: Build OpenField Server

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Windows (x64)'
        type: boolean
        default: true
      build_linux:
        description: 'Linux (x64)'
        type: boolean
        default: true
      build_linux_arm:
        description: 'Linux (ARM64)'
        type: boolean
        default: false
      build_darwin:
        description: 'macOS (x64)'
        type: boolean
        default: false

env:
  GO_VERSION: '1.25.0'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, goos: windows, goarch: amd64, ext: .exe, enabled: true }
          - { os: linux,   goos: linux,   goarch: amd64, ext: '',    enabled: true }
          - { os: linux-arm64, goos: linux, goarch: arm64, ext: '',  enabled: false }
          - { os: darwin,  goos: darwin,  goarch: amd64, ext: '',    enabled: false }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Determine matrix enablement
        id: matrix
        run: |
          ENABLED=${{ matrix.enabled }}
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            case "${{ matrix.os }}" in
              windows) INPUT="${{ github.event.inputs.build_windows }}" ;;
              linux)   INPUT="${{ github.event.inputs.build_linux }}" ;;
              linux-arm64) INPUT="${{ github.event.inputs.build_linux_arm }}" ;;
              darwin)  INPUT="${{ github.event.inputs.build_darwin }}" ;;
            esac
            if [ "$INPUT" == "true" ]; then ENABLED=true; else ENABLED=false; fi
          fi
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"

      - name: Build services
        if: steps.matrix.outputs.enabled == 'true'
        shell: bash
        run: |
          set -e
          mkdir -p dist/bin
          CGO_ENABLED=0
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags="-s -w" \
            -o "dist/bin/openfield-account${{ matrix.ext }}" ./services/account/cmd
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags="-s -w" \
            -o "dist/bin/openfield-storage${{ matrix.ext }}" ./services/storage/cmd
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags="-s -w" \
            -o "dist/bin/openfield-chat${{ matrix.ext }}" ./services/chat/cmd
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags="-s -w" \
            -o "dist/bin/openfield-posts${{ matrix.ext }}" ./services/posts/cmd
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags="-s -w" \
            -o "dist/bin/openfield-push${{ matrix.ext }}" ./services/push/cmd
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags="-s -w" \
            -o "dist/bin/openfield-gateway${{ matrix.ext }}" ./services/gateway/cmd

      - name: Package
        if: steps.matrix.outputs.enabled == 'true'
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.goos }}" == "windows" ]; then
            zip -r openfield-server-${{ matrix.goos }}-${{ matrix.goarch }}.zip bin
          else
            tar -czf openfield-server-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz bin
          fi

      - name: Upload artifacts
        if: steps.matrix.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openfield-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/openfield-server-${{ matrix.goos }}-${{ matrix.goarch }}.*
          if-no-files-found: error

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
